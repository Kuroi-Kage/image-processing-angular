<main class="app">
  <aside class="rail">
    <div class="rail-logo">
      <lucide-angular [img]="ImagePlus" class="icon"></lucide-angular>
    </div>
    <nav class="rail-nav" aria-label="Navigation principale">
      <button class="rail-btn actif" aria-label="Éditeur">
        <lucide-angular [img]="FileImage" class="icon"></lucide-angular>
      </button>
      <button class="rail-btn" aria-label="Calques">
        <lucide-angular [img]="Layers3" class="icon"></lucide-angular>
      </button>
      <button class="rail-btn" aria-label="Galerie">
        <lucide-angular [img]="Grid2X2" class="icon"></lucide-angular>
      </button>
    </nav>
    <button class="rail-btn" aria-label="Aide">
      <lucide-angular [img]="CircleHelp" class="icon"></lucide-angular>
    </button>
  </aside>

  <section class="contenu">
    <header class="entete">
      <div class="entete-titre">

        <p class="libelle-titre" [class.editable]="imageActuelle()"
          [attr.contenteditable]="imageActuelle() ? true : null" (blur)="onRenommer($event)"
          (keydown.enter)="$event.preventDefault(); $any($event.target).blur()" [title]="nomFichier() || ''">
          {{ imageActuelle() ? 'Nouveau projet' : 'Projet sans titre' }}</p>


        <lucide-angular [img]="ChevronDown" class="icon icon-discret"></lucide-angular>
      </div>
      <div class="entete-actions">
        <button (click)="onAnnulerDemande()" class="btn-discret">
          <lucide-angular [img]="Undo2" class="icon"></lucide-angular>
          <span class="btn-label"> Annuler</span>
        </button>
        <button class="btn-discret">
          <lucide-angular [img]="Redo2" class="icon"></lucide-angular>
          <span class="btn-label"> Rétablir</span>
        </button>
        <button (click)="onExporterDemande()" class="btn-primaire">
          <lucide-angular [img]="Download" class="icon"></lucide-angular>
          <span class="btn-label"> Exporter</span>
        </button>
      </div>
    </header>

    @if (erreur()) {
    <div class="bandeau-erreur">{{ erreur() }}</div>
    }

    <div class="corps">
      <app-viewer [imageBase64]="imageActuelle()" [imageOriginaleBase64]="imageOriginale()"
        [vueComparaison]="vueComparaison()" [chargement]="chargement()" [histogramme]="histogramme()"
        (comparaisonBasculee)="onComparaisonBasculee()" [outilActif]="outilActif()"
        (selectionChange)="onSelectionChange($event)" (imageImportee)="onImageImportee($event)"
        (ouvrirAmelioration)="onOuvrirAmelioration($event)">
      </app-viewer>

      <app-toolbar [historique]="historique()" [traitementEnCours]="chargement()" [outilActif]="outilActif()"
        (outilChoisi)=" onOutilChoisi($event)" (recadrerDemande)="onRecadrerDemande()"
        (traitementDemande)="onTraitementDemande($event)" (parametreModifie)="onParametreModifie($event)"
        (instructionsSoumises)="onInstructionsSoumises($event)" (effacerDemande)="onEffacerDemande()"
        (ouvrirAmelioration)="onOuvrirAmelioration(null)">
      </app-toolbar>
      @if (modalAmeliorationOuvert()) {
      <app-amelioration-modal [imageBase64]="imageActuelle()" (valider)="onAmeliorerDemande($event)"
        (annuler)="modalAmeliorationOuvert.set(false)">
      </app-amelioration-modal>
      }
    </div>
  </section>
</main>
